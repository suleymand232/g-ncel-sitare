<!DOCTYPE html>
<html>
<head>
    <title>Sene Başı Öğretmenler Kurulu Toplantısı</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <style>
        :root {
            --bg-color: #dedede;
            --box-bg: dimgray;
            --text-color: #3f3f3f;
            --heading-color: #dedede;
            --link-color: #dedede;
        }

        body.dark-mode {
            --bg-color: #121212;
            --box-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --heading-color: #dedede;
            --link-color: #dedede;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            -webkit-text-fill-color: var(--text-color);
            margin: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .kutu {
            width: 90%;
            max-width: 1000px;
            margin: 20px auto;
            background-color: var(--box-bg);
            padding: 20px;
            border-radius: 30px;
            box-sizing: border-box;
            transition: background-color 0.3s ease;
        }

        h1, h2, h3, h5 {
            text-align: center;
            margin-left: 0;
            color: var(--heading-color);
            -webkit-text-fill-color: var(--heading-color);
        }

        a {
            color: var(--link-color);
            -webkit-text-fill-color: var(--link-color);
            text-decoration: none;
        }

        .imza {
            text-align: center;
            font-size: 14px;
            color: #ccc;          
            margin-top: 30px;     
            font-style: italic;   
        }

        .AtaturkResmi {
            width: 150px !important;    
            max-width: 100% !important;
            height: auto !important;
            display: block !important;
            margin: 15px auto !important; 
            border-radius: 20px;
        }

        .kutu img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 20px;
        }

        
        #darkModeToggle {
            position: fixed;
            top: 15px;
            right: 15px;
            background-color: var(--box-bg);
            color: var(--heading-color);
            -webkit-text-fill-color: var(--heading-color);
            border: 2px solid var(--heading-color);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <button id="darkModeToggle" onclick="geceModunuAcKapat()">🌙 Mod</button>

    <p class="imza">Made by Süleyman</p>
    <img src="ataturk.png" alt="atatürk" class="AtaturkResmi">
    
    <div class="kutu">
        <h1>Sene Başı Öğretmenler Kurulu Toplantısı</h1>
        <h2>2026-2027 Eğitim Öğretim yılı sene başı öğretmenler kurulu toplantımızı</h2>
        <h3>gerçekleştirdik</h3>
        <hr>
        <img src="okul kurulu.jpg" alt="okul kurulu" width="500">
        <hr>
        <img src="okul-kurulu 2.jpg" alt="›Okulumuzun kurulu" width="500">
        <hr>
        <img src="okul kurulu 3.jpg" alt="okul kurulu" width="500">
        <h5>Yayın: 07.09.2026 - Güncelleme: 07.09.2026 12:43 - Görüntülenme:999999</h5>
    </div>

    <script>
        function geceModunuAcKapat() {
            document.body.classList.toggle('dark-mode');
            const btn = document.getElementById('darkModeToggle');
            
            if (document.body.classList.contains('dark-mode')) {
                btn.innerHTML = "☀️ Mod";
                localStorage.setItem('theme', 'dark');
            } else {
                btn.innerHTML = "🌙 Mod";
                localStorage.setItem('theme', 'light');
            }
        }

        window.onload = function() {
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
                const btn = document.getElementById('darkModeToggle');
                if (btn) btn.innerHTML = "☀️ Mod";
            }
        }
    </script>
</body>
</html>
